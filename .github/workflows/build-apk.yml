name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "::error::debug.keystore.base64 missing in repo root"
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Found: $APK"
          cp "$APK" dist/SubNexa.apk

      - name: Generate update manifest
        run: |
          TAG="latest"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            TAG="${{ github.ref_name }}"
          fi
          SHA256=$(sha256sum dist/SubNexa.apk | awk '{print $1}')
          SIZE=$(stat -c%s dist/SubNexa.apk)
          jq -n \
            --argjson versionCode "${{ github.run_number }}" \
            --arg versionName "1.0.${{ github.run_number }}" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/$TAG/SubNexa.apk" \
            --arg sha256 "$SHA256" \
            --argjson apkSize "$SIZE" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, apkSize: $apkSize}' > dist/version.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubNexa-APK
          path: |
            dist/SubNexa.apk
            dist/version.json

      - name: Move the latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SubNexa latest build
          body: |
            Automatic build from the main branch.
            Download **SubNexa.apk** below and install it on your Android phone.
          files: |
            dist/SubNexa.apk
            dist/version.json
          make_latest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SubNexa.apk
            dist/version.json
          generate_release_notes: true
